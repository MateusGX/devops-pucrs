[project]
name = "afazeres-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"testes/*" = ["S101"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["testes"]
python_files = ["teste_*.py"]
python_functions = ["teste_*"]

[tool.coverage.report]
fail_under = 85
